<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground floor in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --scene:#DCE3E4; --panel:#F6F6F2; --ink:#23282C; --ink-soft:#5A6267; --rule:#CDD1CA; --accent:#2F5D8A; --accent-ink:#fff; --ground:#7F8A6E;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --scene:#1C2124; --panel:#23292D; --ink:#E6E9E4; --ink-soft:#9EA6AA; --rule:#3A4247; --accent:#88B0D8; --accent-ink:#12171B; --ground:#33382F; color-scheme:dark; }
}
:root[data-theme="dark"]{ --scene:#1C2124; --panel:#23292D; --ink:#E6E9E4; --ink-soft:#9EA6AA; --rule:#3A4247; --accent:#88B0D8; --accent-ink:#12171B; --ground:#33382F; color-scheme:dark; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; background:var(--scene); color:var(--ink); font:400 15px/1.45 Barlow,"Segoe UI",system-ui,sans-serif; overflow:hidden}
#stage{position:fixed; inset:0}
#stage canvas{display:block; touch-action:none}
.card{background:var(--panel); border:1px solid var(--rule); border-radius:4px}
.top{position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; right:12px; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; pointer-events:none}
.top > *{pointer-events:auto}
.title{padding:10px 14px 11px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:1.7rem; line-height:1; margin:0}
.sub{color:var(--ink-soft); font-size:13.5px; margin:4px 0 6px}
.toggle{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500}
.toggle input{accent-color:var(--accent); width:16px; height:16px; margin:0}
.modes{display:flex; padding:3px; gap:2px}
.modes button{font:inherit; font-weight:600; border:0; background:transparent; color:var(--ink); padding:7px 12px; border-radius:2px; cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
select{font:inherit; font-weight:600; color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:9px 10px; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.help{position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); max-width:min(430px, calc(100% - 220px)); padding:8px 12px; font-size:13.5px}
.map{position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); width:190px; padding:6px; line-height:0}
.map canvas{width:100%; height:auto; cursor:crosshair; display:block}
.map .cap{line-height:1.3; font-size:12.5px; color:var(--ink-soft); padding:6px 2px 1px}
.pad{position:fixed; right:214px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:none; flex-direction:column; gap:10px}
.pad button{width:56px; height:56px; border-radius:50%; border:1px solid var(--rule); background:var(--panel); color:var(--ink); font-size:20px; touch-action:none; user-select:none; -webkit-user-select:none}
@media (pointer:coarse){ body.walk .pad{display:flex} }
@media (max-width:700px){
  .map{width:118px} .map .cap{display:none}
  .pad{right:140px}
  .help{max-width:calc(100% - 150px); font-size:12.5px}
  body.walk .help{display:none}
  h1{font-size:1.4rem}
}
.fail{position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center}
</style>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <div class="card title">
    <h1>Ground floor, 1,066 sq ft</h1>
    <p class="sub">Modelled from your plan, roof lifted off so you can see in.</p>
    <label class="toggle"><input type="checkbox" id="labels" checked> Room names</label>
  </div>
  <div class="card modes" role="group" aria-label="View">
    <button type="button" id="mOrbit" aria-pressed="true">Overview</button>
    <button type="button" id="mWalk" aria-pressed="false">Walk through</button>
    <button type="button" id="mTour" aria-pressed="false">Play tour</button>
  </div>
  <select id="goto" aria-label="Go to a room">
    <option value="">Go to a room…</option>
  </select>
</div>

<div class="card help" id="help"></div>
<div class="card map">
  <canvas id="map" aria-label="Your floor plan. Click a spot to stand there."></canvas>
  <div class="cap">Click the plan to stand there</div>
</div>
<div class="pad" aria-hidden="true"><button type="button" id="padF">▲</button><button type="button" id="padB">▼</button></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

}

function wall(x0,y0,x1,y1,ops=[]){
  const horiz=(x1-x0)>=(y1-y0), A=horiz?x0:y0, B=horiz?x1:y1;
  const R=(a,b)=>horiz?[a,y0,b,y1]:[x0,a,x1,b];
  let cur=A;
  ops.slice().sort((p,q)=>p[0]-q[0]).forEach(([a,b,kind,hinge,side])=>{
    if(a>cur) box(...R(cur,a),0,WALL_H,wallMats,{block:true});
    const o=OPEN[kind];
    if(o.sill>0) box(...R(a,b),0,o.sill,wallMats,{block:true});
    box(...R(a,b),o.head,WALL_H,wallMats,{});
    if(kind==='door'||kind==='main'){
      // door leaf, swung fully open
      const len=(b-a), hp=hinge==='a'?a+4:b-4, mid=horiz?(y0+y1)/2:(x0+x1)/2, far=mid+side*len, lo=Math.min(mid,far), hi=Math.max(mid,far);
      const r=horiz?[hp-2,lo,hp+2,hi]:[lo,hp-2,hi,hp+2];
      box(...r,0.05,DOOR_H-0.1,kind==='main'?M.teak:M.door,{block:true});

    } else {
      const c=horiz?(y0+y1)/2:(x0+x1)/2;
      const g=horiz?[a,c-1,b,c+1]:[c-1,a,c+1,b];
      const glass=box(...g,o.sill,o.head,M.glass,{cast:false,block:true}); glass.receiveShadow=false;
      const fr=horiz?[a,y0,b,y1]:[x0,a,x1,b];
      box(...fr,o.head-0.18,o.head,M.frame,{cast:false});
      box(...(horiz?[a-3,y0-5,b+3,y1+5]:[x0-5,a-3,x1+5,b+3]),o.sill-0.12,o.sill,M.sill,{cast:false});

function isFree(x,z){
  if(x<-90||x>90||z<-40||z>plotFront+20) return false;
  for(const [a,b,c,d] of blockers) if(x>a-RAD&&x<c+RAD&&z>b-RAD&&z<d+RAD) return false;
  for(const [ax,az,bx,bz,t] of segBlockers){ const vx=bx-ax,vz=bz-az,k=Math.max(0,Math.min(1,((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz))); if(Math.hypot(x-ax-vx*k,z-az-vz*k)<RAD+t) return false; }
  return true;
}
function standAt(px,py,lx,ly){ walker.x=fx(px); walker.z=fz(py); const dx=fx(lx)-walker.x, dz=fz(ly)-walker.z; walker.yaw=Math.atan2(-dx,-dz); walker.pitch=-0.04; }
function walkerPose(){ return {pos:new THREE.Vector3(walker.x,EYE,walker.z), q:new THREE.Quaternion().setFromEuler(new THREE.Euler(walker.pitch,walker.yaw,0,'YXZ'))}; }

  tween.t+=dt; const k=Math.min(1,tween.t/tween.dur), e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

  mode='tour'; controls.enabled=false; setPressed();
  const P=TOUR.map(([p,l])=>({p:new THREE.Vector3(fx(p[0]),EYE,fz(p[1])), l:new THREE.Vector3(fx(l[0]),EYE-0.6,fz(l[1]))}));
  const segs=[]; for(let i=0;i<P.length-1;i++){ segs.push({a:P[i],b:P[i+1],dur:Math.max(2.2,P[i].p.distanceTo(P[i+1].p)/4.2)}); }
  const d=new THREE.PerspectiveCamera(); d.position.copy(P[0].p); d.lookAt(P[0].l);
  flyTo(P[0].p.clone(),d.quaternion.clone(),68,()=>{ tour={segs,i:0,t:0,look:P[0].l.clone()}; });
}
const tmpLook=new THREE.Vector3();
function stepTour(dt){
  const s=tour.segs[tour.i]; tour.t+=dt; const k=Math.min(1,tour.t/s.dur), e=k*k*(3-2*k);
  camera.position.lerpVectors(s.a.p,s.b.p,e); camera.position.y=EYE+Math.sin(performance.now()/420)*0.04;
  tmpLook.lerpVectors(s.a.l,s.b.l,Math.min(1,e*1.25)); camera.lookAt(tmpLook);
  walker.x=camera.position.x; walker.z=camera.position.z;
  if(k>=1){ tour.i++; tour.t=0; if(tour.i>=tour.segs.length){ const e2=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ'); walker.yaw=e2.y; walker.pitch=e2.x; tour=null; mode='walk'; setPressed(); } }
}

/* ---------- Input ---------- */
const keys=new Set(); let padF=false,padB=false;
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='Escape'&&mode!=='orbit'){ goOrbit(); return; }
  if(mode==='walk'&&/^(Key[WASD]|Arrow\w+|Shift\w+)$/.test(e.code)){ keys.add(e.code); if(e.code.startsWith('Arrow')) e.preventDefault(); }
});
addEventListener('keyup',e=>keys.delete(e.code)); addEventListener('blur',()=>keys.clear());
const hold=(el,set)=>{ el.addEventListener('pointerdown',e=>{e.preventDefault();set(true);el.setPointerCapture(e.pointerId);}); ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>set(false))); };
hold($('padF'),v=>padF=v); hold($('padB'),v=>padB=v);
let look=null; const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{ if(mode!=='walk'||tween) return; look={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!look) return; const k=e.pointerType==='touch'?0.006:0.004; walker.yaw-=(e.clientX-look.x)*k; walker.pitch=Math.max(-1.2,Math.min(1.2,walker.pitch-(e.clientY-look.y)*k)); look={x:e.clientX,y:e.clientY}; });
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>look=null));
function stepWalk(dt){
  let f=0,s=0;
  if(keys.has('KeyW')||keys.has('ArrowUp')||padF) f++; if(keys.has('KeyS')||keys.has('ArrowDown')||padB) f--;
  if(keys.has('KeyA')) s--; if(keys.has('KeyD')) s++;
  if(keys.has('ArrowLeft')) walker.yaw+=1.9*dt; if(keys.has('ArrowRight')) walker.yaw-=1.9*dt;
  let sp=(keys.has('ShiftLeft')||keys.has('ShiftRight')?13:6.5)*dt; if(f&&s) sp*=0.7071;
  const y=walker.yaw, dx=(-Math.sin(y)*f+Math.cos(y)*s)*sp, dz=(-Math.cos(y)*f-Math.sin(y)*s)*sp;
  if(dx&&isFree(walker.x+dx,walker.z)) walker.x+=dx; if(dz&&isFree(walker.x,walker.z+dz)) walker.z+=dz;
  camera.position.set(walker.x,EYE,walker.z); camera.rotation.set(walker.pitch,walker.yaw,0);
}
$('mOrbit').onclick=goOrbit;
$('mWalk').onclick=()=>{ if(mode==='walk') return; if(mode==='tour'){ tour=null; tween=null; mode='walk'; const e=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ'); walker.yaw=e.y; walker.pitch=e.x; if(!isFree(walker.x,walker.z)) standAt(340,1520,362,1000); setPressed(); return; } standAt(340,1520,362,1000); goWalk(); };
$('mTour').onclick=()=>{ if(mode!=='tour') startTour(); };
sel.onchange=()=>{ const r=ROOMS[sel.value]; if(!r) return; tour=null; standAt(...r.stand,...r.look); goWalk(); sel.value=''; };
function updateHelp(){
  const coarse=matchMedia('(pointer:coarse)').matches;
  $('help').textContent = mode==='walk' ? (coarse?'Drag to look around, hold the arrows to walk.':'Drag to look around. Walk with W A S D or the arrow keys, hold Shift to hurry. Esc returns to the overview.')
    : mode==='tour' ? 'Touring the house from the street. Press Walk through to take over, or Esc to stop.'
    : (coarse?'Drag to rotate, pinch to zoom, two-finger drag to pan.':'Drag to rotate, scroll to zoom, right-drag to pan. Pick a room or click the plan to step inside.');
}

/* ---------- Minimap (your drawing) ---------- */
const mapC=$('map'), mapImg=new Image();
mapImg.onload=()=>{ sizeMap(); };
mapImg.src=MAP_SRC;
function sizeMap(){ const w=Math.round(mapC.parentElement.clientWidth*Math.min(devicePixelRatio,2)); mapC.width=w; mapC.height=Math.round(w*1440/840); drawMap(); }
function drawMap(){
  if(!mapImg.complete) return; const x=mapC.getContext('2d'), w=mapC.width, h=mapC.height; x.drawImage(mapImg,0,0,w,h);
  if(mode==='orbit'&&!tween) return;
  const px=(walker.x*S+OX)/840*w, py=(walker.z*S+OY)/1440*h; if(py>h+4) return;
  const r=Math.max(4,w/40), a=-walker.yaw-Math.PI/2;
  x.fillStyle='rgba(214,92,48,0.28)'; x.beginPath(); x.moveTo(px,py); x.arc(px,py,r*5,a-0.55,a+0.55); x.closePath(); x.fill();
  x.fillStyle='#D65C30'; x.strokeStyle='#fff'; x.lineWidth=2; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); x.stroke();
}
mapC.addEventListener('click',e=>{
  const rc=mapC.getBoundingClientRect(), px=(e.clientX-rc.left)/rc.width*840, py=(e.clientY-rc.top)/rc.height*1440;
  if(!isFree(fx(px),fz(py))) return;
  tour=null; const keep=mode==='walk'; walker.x=fx(px); walker.z=fz(py);
  if(!keep){ const dx=12.5-walker.x, dz=20-walker.z; walker.yaw=Math.atan2(-dx,-dz); walker.pitch=-0.04; if(mode==='tour') mode='walk'; goWalk(); }
});

/* ---------- Theme, size, loop ---------- */
function applyTheme(){ scene.background=new THREE.Color(css('--scene')||'#DCE3E4'); window.__ground.material.color.set(css('--ground')||'#7F8A6E'); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); sizeMap(); }
addEventListener('resize',resize);
camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update();
standAt(340,1520,362,1000);
applyTheme(); resize(); setPressed();
let last=performance.now();
(function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(tween) stepTween(dt); else if(tour) stepTour(dt); else if(mode==='walk') stepWalk(dt); else controls.update();
  renderer.render(scene,camera); if(mode!=='orbit') drawMap();
  requestAnimationFrame(frame);
})(last);
})();
</script>
</body>
</html>
